name: InfuseTax Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-web:
    name: Next.js Frontend Quality & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend-web && npm ci

      - name: Type-Check & Build Production Next.js Bundle
        run: cd frontend-web && npm run build

  validate-mobile:
    name: Flutter Cross-Platform Mobile Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter 3.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Validate Flutter Dependencies
        run: cd frontend-mobile && flutter pub get

  docker-lint:
    name: Docker Stack Orchestration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Docker Compose Syntax
        run: docker compose config
