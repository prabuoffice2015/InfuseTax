services:
  # 1. Reverse Proxy Gateway (Nginx) - Main Web Entrypoint on port 8888
  nginx:
    image: nginx:alpine
    container_name: infusetax_nginx
    restart: always
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/backend:ro
    depends_on:
      - frontend
      - backend
    networks:
      - infusetax_network

  # 2. Frontend Web Application & Public Marketing Portal (Next.js) on port 3080
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: infusetax_frontend
    restart: always
    ports:
      - "3080:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - infusetax_network

  # 3. Backend REST API (PHP 8.3-FPM)
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: infusetax_backend
    restart: always
    volumes:
      - ./backend:/var/www/backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: infusetax_db
      DB_USERNAME: infusetax_user
      DB_PASSWORD: infusetax_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - infusetax_network

  # 4. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: infusetax_postgres
    restart: always
    environment:
      POSTGRES_DB: infusetax_db
      POSTGRES_USER: infusetax_user
      POSTGRES_PASSWORD: infusetax_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infusetax_network

  # 5. Redis 7 Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: infusetax_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infusetax_network

  # 6. Cloudflare Zero-Trust Quick Tunnel (Free Public HTTPS Sharing)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: infusetax_tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - infusetax_network

networks:
  infusetax_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
