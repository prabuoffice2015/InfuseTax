services:
  # 1. Reverse Proxy Gateway (Nginx) - Port 80 & 443
  nginx:
    image: nginx:alpine
    container_name: infusetax_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/backend:ro
    depends_on:
      - frontend
      - backend
    networks:
      - infusetax_network

  # 2. Frontend Web Application (Next.js)
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: infusetax_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - infusetax_network

  # 3. Backend REST API (PHP 8.3-FPM) - Reads secrets securely from backend/.env
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: infusetax_backend
    restart: always
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    networks:
      - infusetax_network

  # 4. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: infusetax_postgres
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-infusetax_db}
      POSTGRES_USER: ${DB_USERNAME:-infusetax_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-infusetax_secure_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infusetax_network

  # 5. Redis 7 Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: infusetax_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infusetax_network

networks:
  infusetax_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
