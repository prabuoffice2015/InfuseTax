services:
  # 1. Reverse Proxy Gateway (Nginx) - Port 80 & 443 for Production
  nginx:
    image: nginx:alpine
    container_name: infusetax_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/backend:ro
      - certs_data:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - infusetax_network

  # 2. Frontend Web Application (Next.js)
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: infusetax_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - infusetax_network

  # 3. Backend REST API (PHP 8.3-FPM)
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: infusetax_backend
    restart: always
    volumes:
      - ./backend:/var/www/backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: infusetax_db
      DB_USERNAME: infusetax_user
      DB_PASSWORD: infusetax_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: https://taxpartner.in
    depends_on:
      - postgres
      - redis
    networks:
      - infusetax_network

  # 4. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: infusetax_postgres
    restart: always
    environment:
      POSTGRES_DB: infusetax_db
      POSTGRES_USER: infusetax_user
      POSTGRES_PASSWORD: infusetax_secure_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infusetax_network

  # 5. Redis 7 Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: infusetax_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infusetax_network

networks:
  infusetax_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certs_data:
