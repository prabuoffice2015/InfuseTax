server {
    listen 80;
    server_name taxpartner.in www.taxpartner.in api.taxpartner.in portal.taxpartner.in localhost _;

    client_max_body_size 50M;

    # 1. Information Disclosure Protection (Zero Version Leakage)
    server_tokens off;

    # 2. OWASP Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 3. Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 4. Trust Cloudflare & Proxy Forwarding
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # 5. Backend REST API Gateway (PHP 8.3-FPM)
    location /api {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # 6. PDF Document Serving (Receipts, Invoices & Guides)
    location ~* \.pdf$ {
        root /var/www/backend/public;
        add_header Content-Type application/pdf;
        add_header Content-Disposition "inline";
    }

    # 7. Block All Hidden Files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 8. Next.js Static Optimization Cache
    location /_next/static {
        proxy_pass http://frontend:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 9. Next.js Public Web & Portals
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Disable aggressive browser caching for dynamic portal updates
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
