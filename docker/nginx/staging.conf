# ==============================================================================
# InfuseTax Staging Environment Gateway (Nginx) - Port 8081
# ==============================================================================
server {
    listen 80;
    server_name stage.taxpartner.in stage localhost _;

    client_max_body_size 50M;
    server_tokens off;

    # OWASP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Environment "Staging-QA" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Backend REST API Gateway (PHP 8.3-FPM)
    location /api {
        fastcgi_pass backend_stage:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_HOST $host;
    }

    # 2. PDF Document Serving
    location ~* \.pdf$ {
        root /var/www/backend/public;
        add_header Content-Type application/pdf;
        add_header Content-Disposition "inline";
    }

    # 3. Block Hidden Files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 4. Next.js Static Cache
    location /_next/static {
        proxy_pass http://frontend_stage:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 5. Next.js Staging Portal
    location / {
        proxy_pass http://frontend_stage:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
